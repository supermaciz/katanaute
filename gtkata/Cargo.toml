[package]
name = "gtkata"
version = "0.1.0"
edition = "2024"

[dependencies]
gtk4 = { version = "0.10.2", package = "gtk4", features = ["v4_20"] }
libadwaita = { version = "0.8.0", package = "libadwaita", features = ["v1_8"] }
glib = "0.20"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
directories = "6.0"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
html2pango = "0.5"
syntect = "5.0"
markdown = "1.0.0-alpha.7"
log = "0.4"

